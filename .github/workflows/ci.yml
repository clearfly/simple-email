name: Java CI

on: [ push ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: corretto
          java-version: 25
          cache: maven
      - name: Run Integration Tests
        run: mvn clean test -P errorprone
